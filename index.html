<meta name="description" content="C&J Aviation LLC internal accounting and admin site.">
<meta name="robots" content="noindex, nofollow">

<link rel="apple-touch-icon" href="img/logo.png">
<link rel="manifest" href="manifest.json">
<script>
/* Force https. GitHub Pages redirects http -> https, but a browser can still
 * serve a cached http copy, and Google sign-in rejects http origins outright
 * (Error 400: origin_mismatch). This bounces before anything else loads. */
(function(){
  if (location.protocol === 'http:' && location.hostname.indexOf('localhost') === -1) {
    location.replace('https://' + location.host + location.pathname + location.search + location.hash);
  }
})();
</script>
<script>
/* Safari keeps serving cached copies of app.js / app.css even after the page reloads, so every
 * asset URL carries the site version: a push changes the URL and every browser fetches fresh.
 * config.js itself is fetched with a timestamp so the version it carries is always current. */
document.write('<script src="config.js?_=' + Date.now() + '"><\/script>');
</script>
<script>
(function(){
  var v = encodeURIComponent((window.CJ_CONFIG && window.CJ_CONFIG.siteVersion) || Date.now());
  document.write('<link rel="stylesheet" href="css/app.css?v=' + v + '">');
  document.write('<link rel="stylesheet" href="css/bench.css?v=' + v + '">');
})();
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Bench Stock tab: QR labels + year-end PDF -->
<script src="js/vendor/qrcode.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
</head>
<body>
<div id="root"><div class="loading"><div><div class="spin"></div>Loading…</div></div></div>
<script>
(function(){
  var v = encodeURIComponent((window.CJ_CONFIG && window.CJ_CONFIG.siteVersion) || Date.now());
  document.write('<script src="js/api.js?v=' + v + '"><\/script>');
  document.write('<script src="js/app.js?v=' + v + '"><\/script>');
  document.write('<script src="js/bench.js?v=' + v + '"><\/script>');
})();
</script>
